name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      - name: Verify tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tagVersion = $env:GITHUB_REF_NAME -replace '^v',''
          $appVersion = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if ($tagVersion -ne $appVersion) {
            Write-Error "Tag v$tagVersion does not match app version $appVersion (tauri.conf.json). Sync package.json, Cargo.toml, and tauri.conf.json before tagging."
            exit 1
          }

      - name: Verify updater signing secret
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            Write-Host "::error::TAURI_SIGNING_PRIVATE_KEY is required for signed updater artifacts. Paste the full private key (including the untrusted comment line) from the same tauri signer generate run as plugins.updater.pubkey."
            exit 1
          }

      # 在完整构建前校验私钥/密码可用，避免编 8 分钟后才因签名失败
      - name: Dry-run updater signing key
        shell: pwsh
        env:
          CI: "true"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $tmp = Join-Path $env:RUNNER_TEMP "only-todo-signer-dry-run.bin"
          $sig = "$tmp.sig"
          Set-Content -Path $tmp -Value "only-todo signer dry-run" -NoNewline
          try {
            npm run tauri -- signer sign $tmp
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::Updater signing dry-run failed. Check TAURI_SIGNING_PRIVATE_KEY (full key text including untrusted comment) and TAURI_SIGNING_PRIVATE_KEY_PASSWORD match the key pair used for plugins.updater.pubkey in tauri.conf.json."
              exit 1
            }
            if (-not (Test-Path $sig)) {
              Write-Host "::error::Updater signing dry-run produced no .sig file"
              exit 1
            }
          } finally {
            Remove-Item -Force -ErrorAction SilentlyContinue $tmp, $sig
          }

      - uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Only Todo v__VERSION__
          releaseBody: See the assets to download this version and install.
          releaseDraft: false
          prerelease: false
          args: --bundles nsis

      # 生成国内代理版 manifest：改写 platforms.*.url，signature 不变
      - name: Publish China-proxy updater manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PROXY_PREFIX: ${{ vars.GH_PROXY_PREFIX }}
        run: |
          $appVersion = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $tag = "v$appVersion"
          $prefix = if (-not [string]::IsNullOrWhiteSpace($env:GH_PROXY_PREFIX)) {
            $env:GH_PROXY_PREFIX
          } else {
            "https://ghfast.top/"
          }
          gh release download $tag -p latest.json -D .
          if (-not (Test-Path latest.json)) {
            Write-Host "::error::latest.json not found on release $tag"
            exit 1
          }
          node scripts/rewrite-updater-manifest.mjs latest.json latest-cn.json $prefix
          gh release upload $tag latest-cn.json --clobber
          Write-Host "Uploaded latest-cn.json to $tag (proxy=$prefix)"
