[tools]
node = "24"
rust = "stable"

[tasks.install]
description = "安装前端依赖"
run = "npm install"

[tasks.dev]
description = "启动 Tauri 开发模式"
run = "npm run tauri dev"
depends = ["install"]

[tasks.check]
description = "Rust 编译检查"
run = "cargo check"
dir = "src-tauri"

[tasks.build]
description = "构建生产包"
run = "npm run tauri build"
depends = ["install"]

[tasks.format]
description = "Prettier 格式化前端"
run = "npm run format"

[tasks.format-check]
description = "Prettier 检查前端格式"
run = "npm run format:check"

[tasks.lint]
description = "ESLint 检查前端"
run = "npm run lint"

[tasks.clippy]
description = "Rust clippy（警告当错误）"
run = "cargo clippy -- -D warnings"
dir = "src-tauri"

[tasks.gen-types]
description = "从 Rust domain 导出 TypeScript 类型"
run = "cargo run --bin export-ts"
dir = "src-tauri"

[tasks.gen-types-check]
description = "检查 gen-types 与仓库无漂移"
depends = ["gen-types"]
run = "git diff --exit-code src/api/generated"

[tasks.build-fe]
description = "前端类型检查与生产构建"
run = "npm run build"
depends = ["install"]

[tasks.test]
description = "Rust 单元测试"
run = "cargo test"
dir = "src-tauri"

[tasks.ci]
description = "本地复现 CI（format/lint/构建/rust/test/gen-types）"
depends = ["format-check", "lint", "build-fe", "check", "clippy", "test", "gen-types-check"]

[tasks.bump-version]
description = "同步四处版本号（patch|minor|major|x.y.z，可选 tag / check）"
run = "node scripts/bump-version.mjs"

[tasks.clean]
description = "清理 Rust 编译产物"
run = "cargo clean"
dir = "src-tauri"