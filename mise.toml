[tools]
node = "24"
rust = "stable"

[tasks.install]
description = "安装前端依赖"
run = "npm install"

[tasks.dev]
description = "启动 Tauri 开发模式"
run = "npm run tauri dev"
depends = ["install"]

[tasks.check]
description = "Rust 编译检查"
run = "cargo check"
dir = "src-tauri"

[tasks.build]
description = "构建生产包"
run = "npm run tauri build"
depends = ["install"]

[tasks.format]
description = "Prettier 格式化前端"
run = "npm run format"

[tasks.format-check]
description = "Prettier 检查前端格式"
run = "npm run format:check"

[tasks.lint]
description = "ESLint 检查前端"
run = "npm run lint"

[tasks.clippy]
description = "Rust clippy（警告当错误）"
run = "cargo clippy -- -D warnings"
dir = "src-tauri"

[tasks.gen-types]
description = "从 Rust domain 导出 TypeScript 类型"
run = "cargo run --bin export-ts"
dir = "src-tauri"

[tasks.clean]
description = "清理 Rust 编译产物"
run = "cargo clean"
dir = "src-tauri"