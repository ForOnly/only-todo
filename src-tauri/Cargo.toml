[package]
name = "only-todo"
version = "1.0.5"
description = "Local-first desktop todo assistant"
authors = ["you"]
edition = "2021"
# 与 export-ts 并存时，tauri/cargo run 默认启动应用入口
default-run = "only-todo"

[lib]
name = "only_todo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
ts-rs = { version = "10", features = ["serde-compat"] }
tauri-plugin-process = "2"

[[bin]]
name = "export-ts"
path = "src/bin/export_ts.rs"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_Foundation", "Win32_System_Registry"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
